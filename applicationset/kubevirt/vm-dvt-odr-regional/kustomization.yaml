---
resources:
  - ../../base
commonLabels:
  app: vm-dvt-odr
patches:
  - target:
      kind: ApplicationSet
      name: APPSET_NAME
    patch: |-
      - op: replace
        path: /metadata/name
        value: vm-dvt-odr-appset
      - op: replace
        path: /spec/generators/0/matrix/generators/0/git/directories/0/path
        value: workloads/kubevirt/vm-dvt/odr-regional
      - op: replace
        path: /spec/generators/0/matrix/generators/1/list/elements/0/name
        value: dr1
      - op: replace
        path: /spec/template/spec/destination/namespace
        value: vm-dvt-odr
      - op: replace
        path: /spec/template/metadata/name
        value: vm-dvt-odr-{{name}}