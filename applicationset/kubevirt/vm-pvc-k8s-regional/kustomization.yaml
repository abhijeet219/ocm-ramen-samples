---
resources:
  - ../../base
commonLabels:
  app: vm-pvc
patches:
  - target:
      kind: ApplicationSet
      name: APPSET_NAME
    patch: |-
      - op: replace
        path: /metadata/name
        value: vm-pvc-k8s-appset
      - op: replace
        path: /spec/generators/0/matrix/generators/0/git/directories/0/path
        value: workloads/kubevirt/vm-pvc/k8s-regional
      - op: replace
        path: /spec/generators/0/matrix/generators/1/list/elements/0/name
        value: dr1
      - op: replace
        path: /spec/template/spec/destination/namespace
        value: vm-pvc
      - op: replace
        path: /spec/template/metadata/name
        value: vm-pvc-k8s-{{name}}