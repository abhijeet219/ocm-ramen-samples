---
resources:
  - ../base
commonLabels:
  app: deployment-rbd
patches:
  - target:
      kind: ApplicationSet
      name: APPSET_NAME
    patch: |-
      - op: replace
        path: /metadata/name
        value: deployment-rbd-appset
      - op: replace
        path: /spec/generators/0/matrix/generators/0/git/directories/0/path
        value: workloads/deployment/k8s-regional-rbd
      - op: replace
        path: /spec/generators/0/matrix/generators/1/list/elements/0/name
        value: dr1
      - op: replace
        path: /spec/template/spec/destination/namespace
        value: deployment-rbd
      - op: replace
        path: /spec/template/metadata/name
        value: deployment-rbd-{{name}}